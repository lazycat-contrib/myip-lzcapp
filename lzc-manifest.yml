application:
  subdomain: myip
  multi_instance: false
  public_path:
    - /

services:
  myip:
    # upstream: docker.io/jason5ng32/myip:v8.0.0
    image: docker.1ms.run/jason5ng32/myip:v8.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:18966/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

usage: |
  MyIP 是全能 IP 工具箱：查询本机 IP 与地理位置、DNS 泄露检测、WebRTC 检测、
  国内外网站连通性测试等。打开即用，无需配置。
